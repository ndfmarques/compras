<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Despesas">
<title>Despesas — Ancortex</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f2f2f7;color:#1a1a1a;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:16px 16px 48px}

/* Header */
.header{margin-bottom:20px}
.header h1{font-size:22px;font-weight:700;color:#1a1a1a}
.header p{font-size:13px;color:#888;margin-top:2px}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;padding:10px;text-align:center;font-size:14px;font-weight:500;border:1.5px solid #ddd;border-radius:12px;cursor:pointer;color:#888;background:#fff;transition:all .15s;-webkit-tap-highlight-color:transparent}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* Views */
#view-novo,#view-lista{display:none}
#view-novo.active,#view-lista.active{display:block}

/* Card */
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}

/* Upload */
.upload-zone{border:2px dashed #d1d1d6;border-radius:12px;padding:40px 20px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
.upload-zone:active{background:#f9f9f9}
.upload-icon{font-size:40px;display:block;margin-bottom:10px}
.upload-zone p{font-size:15px;color:#888}
.upload-zone small{font-size:12px;color:#bbb;margin-top:4px;display:block}
#fileInput{display:none}

/* Preview */
#previewImg{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:12px;display:none}

/* Valor row */
.valor-row{display:none;align-items:center;gap:10px;margin-top:14px}
.valor-box{flex:1;background:#f2f2f7;border-radius:12px;padding:12px 14px}
.valor-label{font-size:11px;color:#888;margin-bottom:3px;text-transform:uppercase;letter-spacing:.5px}
.valor-input{font-size:28px;font-weight:700;color:#1a1a1a;background:transparent;border:none;outline:none;width:100%;font-family:inherit}
.ia-badge{font-size:12px;padding:6px 11px;border-radius:20px;background:#f2f2f7;color:#888;white-space:nowrap;display:flex;align-items:center;gap:5px;flex-shrink:0;font-weight:500}
.ia-badge.ok{background:#e8f5e9;color:#2e7d32}
.ia-badge.err{background:#fff3e0;color:#bf360c}

/* Desc */
.desc-wrap{display:none;margin-top:12px}
.desc-wrap label{font-size:12px;color:#888;display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.desc-wrap input{width:100%;padding:11px 13px;font-size:15px;border:1.5px solid #e5e5ea;border-radius:12px;background:#fff;color:#1a1a1a;font-family:inherit}
.desc-wrap input:focus{outline:none;border-color:#1a1a1a}

/* Btn */
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:14px;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.btn-dark{background:#1a1a1a;color:#fff}
.btn-dark:active{opacity:.8}
.btn-dark:disabled{opacity:.3;cursor:not-allowed}
.btn-outline{background:#fff;color:#1a1a1a;border:1.5px solid #ddd;margin-top:8px}
.btn-outline:active{background:#f2f2f7}

/* Summary */
.summary{background:#1a1a1a;border-radius:16px;padding:18px 20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.summary-left .label{font-size:12px;color:#888;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.summary-left .total{font-size:28px;font-weight:700;color:#fff}
.summary-right{text-align:right}
.summary-right .count{font-size:13px;color:#888;margin-bottom:8px}

/* List */
.receipt-list{display:flex;flex-direction:column;gap:8px}
.receipt-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.r-thumb{width:48px;height:48px;object-fit:cover;border-radius:10px;flex-shrink:0}
.r-ph{width:48px;height:48px;border-radius:10px;flex-shrink:0;background:#f2f2f7;display:flex;align-items:center;justify-content:center;font-size:22px}
.r-info{flex:1;min-width:0}
.r-desc{font-size:14px;font-weight:600;color:#1a1a1a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r-date{font-size:12px;color:#888;margin-top:2px}
.r-amount{font-size:16px;font-weight:700;color:#1a1a1a;white-space:nowrap;margin-right:4px}
.r-del{background:none;border:none;cursor:pointer;color:#ccc;padding:6px;font-size:18px;-webkit-tap-highlight-color:transparent;line-height:1}
.r-del:active{color:#ff3b30}

/* Date group */
.date-group{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.8px;margin:12px 0 6px 4px}

/* Empty */
.empty{text-align:center;padding:48px 20px;color:#bbb;font-size:14px}
.empty .icon{font-size:48px;display:block;margin-bottom:10px}

/* Spinner */
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>💳 Despesas</h1>
    <p id="monthLabel"></p>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-novo" onclick="switchTab('novo')">📷 Novo</div>
    <div class="tab" id="tab-lista" onclick="switchTab('lista')">📋 Registos</div>
  </div>

  <!-- NOVO -->
  <div id="view-novo" class="active">
    <div class="card">
      <div class="upload-zone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <span class="upload-icon">📸</span>
        <p>Tira foto ou carrega o recibo</p>
        <small>JPG, PNG</small>
      </div>
      <input type="file" id="fileInput" accept="image/*" capture="environment">
      <img id="previewImg" alt="recibo">

      <div class="valor-row" id="valorRow">
        <div class="valor-box">
          <div class="valor-label">Valor (USD)</div>
          <input class="valor-input" id="fValor" type="number" step="0.01" placeholder="0.00" inputmode="decimal">
        </div>
        <div class="ia-badge" id="iaBadge">✦ IA</div>
      </div>

      <div class="desc-wrap" id="descWrap">
        <label>Descrição</label>
        <input id="fDesc" type="text" placeholder="ex: combustível, material...">
      </div>

      <button class="btn btn-dark" id="btnGuardar" onclick="guardar()" disabled>Guardar recibo</button>
    </div>
  </div>

  <!-- LISTA -->
  <div id="view-lista">
    <div class="summary">
      <div class="summary-left">
        <div class="label">Total do mês</div>
        <div class="total" id="totalMes">$0.00</div>
      </div>
      <div class="summary-right">
        <div class="count" id="countLabel">0 recibos</div>
        <button class="btn btn-outline" style="margin-top:0;padding:9px 16px;width:auto;font-size:13px" onclick="exportarPDF()">📄 Exportar PDF</button>
      </div>
    </div>
    <div class="receipt-list" id="receiptList"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const KEY = 'ancortex_despesas_v3';
let registos = [];
let imgAtual = null;

// Init
function init(){
  const now = new Date();
  document.getElementById('monthLabel').textContent =
    now.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  try{ registos = JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ registos=[]; }
}

// Tabs
function switchTab(t){
  ['novo','lista'].forEach(x=>{
    document.getElementById('view-'+x).classList.toggle('active',x===t);
    document.getElementById('tab-'+x).classList.toggle('active',x===t);
  });
  if(t==='lista') renderLista();
}

// File input
document.getElementById('fileInput').addEventListener('change', async e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async ev=>{
    imgAtual = ev.target.result;
    const img = document.getElementById('previewImg');
    img.src = imgAtual;
    img.style.display = 'block';
    document.getElementById('valorRow').style.display = 'flex';
    document.getElementById('descWrap').style.display = 'block';
    document.getElementById('btnGuardar').disabled = false;
    setBadge('loading');
    await extrairValor(imgAtual.split(',')[1], file.type||'image/jpeg');
  };
  reader.readAsDataURL(file);
});

function setBadge(state){
  const b = document.getElementById('iaBadge');
  if(state==='loading'){ b.innerHTML='<span class="spin">⟳</span> A ler...'; b.className='ia-badge'; }
  else if(state==='ok'){ b.innerHTML='✦ IA'; b.className='ia-badge ok'; }
  else { b.innerHTML='⚠ Manual'; b.className='ia-badge err'; }
}

async function extrairValor(b64, mime){
  try{
    const resp = await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:120,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:b64}},
          {type:'text',text:'Look at this receipt. Return ONLY valid JSON, no markdown: {"amount": <total as number, no currency>, "description": "<2-4 words in Portuguese describing what was bought>"}. If amount unreadable set null.'}
        ]}]
      })
    });
    const data = await resp.json();
    const txt = data.content?.find(b=>b.type==='text')?.text||'{}';
    let p={};
    try{ p=JSON.parse(txt.replace(/```json|```/g,'').trim()); }catch(e){}
    if(p.amount){ document.getElementById('fValor').value=parseFloat(p.amount).toFixed(2); setBadge('ok'); }
    else setBadge('err');
    if(p.description && !document.getElementById('fDesc').value)
      document.getElementById('fDesc').value = p.description;
  }catch(e){ setBadge('err'); }
}

function guardar(){
  const valor = parseFloat(document.getElementById('fValor').value);
  if(isNaN(valor)||valor<=0){ alert('Preenche o valor.'); return; }
  registos.push({
    id: Date.now(),
    data: new Date().toISOString().split('T')[0],
    valor: valor.toFixed(2),
    descricao: document.getElementById('fDesc').value.trim() || '—',
    imagem: imgAtual
  });
  // Ordenar por data descendente
  registos.sort((a,b)=>b.data.localeCompare(a.data));
  localStorage.setItem(KEY, JSON.stringify(registos));
  resetForm();
  switchTab('lista');
}

function resetForm(){
  document.getElementById('previewImg').style.display='none';
  document.getElementById('valorRow').style.display='none';
  document.getElementById('descWrap').style.display='none';
  document.getElementById('btnGuardar').disabled=true;
  document.getElementById('fValor').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fileInput').value='';
  imgAtual=null;
}

function apagar(id){
  if(!confirm('Apagar este recibo?')) return;
  registos = registos.filter(r=>r.id!==id);
  localStorage.setItem(KEY, JSON.stringify(registos));
  renderLista();
}

function getMesAtual(){
  const now = new Date();
  return registos.filter(r=>{
    const d = new Date(r.data);
    return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
  });
}

function renderLista(){
  const mes = getMesAtual();
  const total = mes.reduce((s,r)=>s+parseFloat(r.valor),0);
  document.getElementById('totalMes').textContent = '$'+total.toFixed(2);
  document.getElementById('countLabel').textContent = mes.length+' recibo'+(mes.length!==1?'s':'');

  const list = document.getElementById('receiptList');
  if(!mes.length){
    list.innerHTML='<div class="empty"><span class="icon">🧾</span>Nenhum recibo este mês</div>';
    return;
  }

  // Agrupar por data
  const grupos = {};
  mes.forEach(r=>{
    if(!grupos[r.data]) grupos[r.data]=[];
    grupos[r.data].push(r);
  });

  let html='';
  Object.keys(grupos).sort((a,b)=>b.localeCompare(a)).forEach(data=>{
    const label = new Date(data+'T12:00:00').toLocaleDateString('pt-PT',{weekday:'short',day:'numeric',month:'long'});
    html+=`<div class="date-group">${label}</div>`;
    grupos[data].forEach(r=>{
      html+=`
      <div class="receipt-item">
        ${r.imagem
          ?`<img class="r-thumb" src="${r.imagem}" alt="recibo">`
          :`<div class="r-ph">🧾</div>`}
        <div class="r-info">
          <div class="r-desc">${r.descricao}</div>
        </div>
        <div class="r-amount">$${r.valor}</div>
        <button class="r-del" onclick="apagar(${r.id})">🗑</button>
      </div>`;
    });
  });
  list.innerHTML=html;
}

async function exportarPDF(){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm',format:'a4'});
  const now = new Date();
  const nomeMes = now.toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  const mes = getMesAtual();
  const total = mes.reduce((s,r)=>s+parseFloat(r.valor),0);

  // ── Página 1: Resumo ──
  // Cabeçalho
  doc.setFillColor(26,26,26);
  doc.rect(0,0,210,42,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.setTextColor(255,255,255);
  doc.text('ANCORTEX',20,20);
  doc.setFont('helvetica','normal');
  doc.setFontSize(11);
  doc.setTextColor(160,160,160);
  doc.text('Relatório de Despesas — '+nomeMes,20,30);
  doc.text('Gerado em '+now.toLocaleDateString('pt-PT'),20,38);

  // Caixa total
  doc.setFillColor(245,245,245);
  doc.rect(18,48,174,22,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(22);
  doc.setTextColor(26,26,26);
  doc.text('$'+total.toFixed(2),22,62);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.text('TOTAL DO MÊS',22,67);
  doc.setFont('helvetica','bold');
  doc.setFontSize(16);
  doc.setTextColor(26,26,26);
  doc.text(String(mes.length),140,62);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.text('RECIBOS',140,67);

  // Tabela
  let y=82;
  doc.setFillColor(26,26,26);
  doc.rect(18,y-5,174,8,'F');
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(255,255,255);
  doc.text('DATA',20,y);
  doc.text('DESCRIÇÃO',55,y);
  doc.text('VALOR',185,y,'right');
  y+=8;

  // Acumulado
  let acumulado=0;
  let row=0;
  // Ordenar por data ascendente para o acumulado fazer sentido
  const mesAsc = [...mes].sort((a,b)=>a.data.localeCompare(b.data));
  for(const r of mesAsc){
    if(y>272){
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(180,180,180);
      doc.text('Ancortex — Documento gerado automaticamente',20,285);
      doc.addPage(); y=20;
    }
    acumulado+=parseFloat(r.valor);
    if(row%2===0){ doc.setFillColor(250,250,250); doc.rect(18,y-4,174,7,'F'); }
    doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(26,26,26);
    doc.text(new Date(r.data+'T12:00:00').toLocaleDateString('pt-PT'),20,y);
    doc.text(r.descricao.substring(0,42),55,y);
    doc.setFont('helvetica','bold');
    doc.text('$'+r.valor,185,y,'right');
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(160,160,160);
    doc.text('acum: $'+acumulado.toFixed(2),185,y+4,'right');
    y+=9; row++;
  }

  // Total final
  y+=4;
  doc.setDrawColor(26,26,26); doc.setLineWidth(0.6); doc.line(18,y,192,y); y+=7;
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.setTextColor(26,26,26);
  doc.text('TOTAL',130,y);
  doc.text('$'+total.toFixed(2),185,y,'right');

  doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(180,180,180);
  doc.text('Ancortex — Documento gerado automaticamente',20,285);

  // ── Páginas seguintes: uma foto por página ──
  for(const r of mes){
    if(!r.imagem) continue;
    doc.addPage();

    // Header da página
    doc.setFillColor(26,26,26);
    doc.rect(0,0,210,22,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(255,255,255);
    doc.text('COMPROVATIVO',20,10);
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(180,180,180);
    doc.text(new Date(r.data+'T12:00:00').toLocaleDateString('pt-PT')+' · '+r.descricao,20,17);
    doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(255,255,255);
    doc.text('$'+r.valor,190,14,'right');

    // Imagem
    try{
      const imgEl = new Image();
      await new Promise(res=>{imgEl.onload=res;imgEl.onerror=res;imgEl.src=r.imagem;});
      const iw=imgEl.naturalWidth||800, ih=imgEl.naturalHeight||600;
      const maxW=174, maxH=240;
      let dw=maxW, dh=(ih/iw)*maxW;
      if(dh>maxH){dh=maxH; dw=(iw/ih)*maxH;}
      const xOff=18+(maxW-dw)/2;
      doc.addImage(r.imagem, r.imagem.includes('png')?'PNG':'JPEG', xOff, 28, dw, dh);
    }catch(e){}

    doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(180,180,180);
    doc.text('Ancortex — Documento gerado automaticamente',20,285);
  }

  doc.save('despesas-ancortex-'+now.toISOString().slice(0,7)+'.pdf');
}

init();
</script>
</body>
</html>
